<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crédit Campus — Espace ambassadeur</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #0f172a; color: #e2e8f0; padding: 16px; min-height: 100vh; }
  .card { background: #1e293b; border-radius: 14px; padding: 20px; max-width: 460px; margin: 0 auto 16px; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
  h1 { font-size: 1.3rem; margin: 0 0 16px; color: #38bdf8; text-align: center; }
  h2 { font-size: 1rem; margin: 20px 0 8px; color: #38bdf8; }
  label { display: block; font-size: .85rem; margin: 10px 0 4px; color: #94a3b8; }
  input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
  select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 20px; padding-right: 40px; }
  button { width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .stat { background: #0f172a; border-radius: 10px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 1.3rem; color: #38bdf8; }
  .stat span { font-size: .75rem; color: #94a3b8; }
  .msg { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: .9rem; }
  .ok { background: #064e3b; color: #6ee7b7; }
  .err { background: #7f1d1d; color: #fca5a5; }
  .hidden { display: none; }
  .logout { background: transparent; color: #94a3b8; border: 1px solid #334155; margin-top: 8px; }
  .info-mode { font-size: .8rem; color: #94a3b8; margin-top: 4px; font-style: italic; }
  .sep { border-top: 1px solid #334155; margin: 20px 0; }
  .recap { background: #0f172a; border-left: 3px solid #38bdf8; padding: 10px 12px; border-radius: 6px; margin-top: 12px; font-size: .85rem; }
  .recap .ligne { display: flex; justify-content: space-between; margin: 4px 0; }
  .recap .total { border-top: 1px solid #334155; padding-top: 6px; margin-top: 6px; font-weight: 700; color: #38bdf8; }
</style>
</head>
<body>

<div id="login" class="card">
  <h1>🌍 Crédit Campus</h1>
  <label>Code parrain</label>
  <input id="code" placeholder="AMB-001" autocomplete="username">
  <label>PIN</label>
  <input id="pin" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password">
  <button onclick="seConnecter()">Se connecter</button>
  <div id="loginMsg"></div>
</div>

<div id="dash" class="card hidden">
  <h1 id="nomAmb">Bonjour</h1>

  <div class="stats">
    <div class="stat"><b id="solde">0</b><span>SOLDE (F)</span></div>
    <div class="stat"><b id="dispo">0</b><span>DISPONIBLE (F)</span></div>
    <div class="stat"><b id="gagne">0</b><span>TOTAL GAGNÉ (F)</span></div>
    <div class="stat"><b id="nb">0</b><span>ACHATS PARRAINÉS</span></div>
  </div>

  <div class="sep"></div>

  <h2>💰 Demander un retrait</h2>

  <label>Montant à retirer (F)</label>
  <input id="montant" type="number" inputmode="numeric" placeholder="500" oninput="majRecap()">

  <label>Mode de retrait</label>
  <select id="mode" onchange="majMode()">
    <option value="">— Choisir —</option>
    <option value="YAS">YAS (Togocom)</option>
    <option value="Flooz">Flooz (Moov)</option>
    <option value="Crédit mobile">Crédit mobile</option>
  </select>
  <div id="modeInfo" class="info-mode"></div>

  <label>Numéro (contact / destination)</label>
  <input id="numero" inputmode="tel" placeholder="90 00 00 00" oninput="majRecap()">

  <div id="recap" class="recap hidden"></div>

  <button onclick="demanderRetrait()">Demander le retrait</button>
  <div id="retraitMsg"></div>

  <button class="logout" onclick="deconnexion()">Déconnexion</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbz1q1RayrPJe7zVw2w8iHu24XYFcIteWGiHKpj6HNEIypUEo0UU-gAvgeH-SCyvdVIw/exec";

const FRAIS = { "YAS": 0.01, "Flooz": 0.005, "Crédit mobile": 0 };

let session = null;

async function api(action, payload = {}) {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

async function seConnecter() {
  const code = document.getElementById("code").value.trim();
  const pin  = document.getElementById("pin").value.trim();
  const msg  = document.getElementById("loginMsg");
  msg.innerHTML = "";
  if (!code || !pin) return msg.innerHTML = '<div class="msg err">Remplis les deux champs</div>';

  try {
    const r = await api("login", { code, pin });
    if (!r.ok) return msg.innerHTML = '<div class="msg err">' + r.error + '</div>';
    session = { code, pin };
    localStorage.setItem("cc_session", JSON.stringify(session));
    afficherDashboard(r.ambassadeur);
  } catch (e) {
    msg.innerHTML = '<div class="msg err">Erreur réseau</div>';
  }
}

function afficherDashboard(a) {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dash").classList.remove("hidden");
  document.getElementById("nomAmb").textContent = "Bonjour " + (a.nom || "");
  document.getElementById("solde").textContent = Math.round(a.solde || 0);
  document.getElementById("dispo").textContent = Math.round(a.disponible || 0);
  document.getElementById("gagne").textContent = Math.round(a.totalGagne || 0);
  document.getElementById("nb").textContent = a.nbAchats || 0;
}

function majMode() {
  const mode = document.getElementById("mode").value;
  const info = document.getElementById("modeInfo");

  if (mode === "YAS") {
    info.textContent = "Tu recevras le montant sur ton compte YAS (Togocom). Frais : 1 %.";
  } else if (mode === "Flooz") {
    info.textContent = "Tu recevras le montant sur ton compte Flooz (Moov). Frais : 0,5 %.";
  } else if (mode === "Crédit mobile") {
    info.textContent = "Ton crédit téléphonique sera rechargé. Aucun frais.";
  } else {
    info.textContent = "";
  }
  majRecap();
}

function majRecap() {
  const montant = Number(document.getElementById("montant").value);
  const mode    = document.getElementById("mode").value;
  const recap   = document.getElementById("recap");

  if (!montant || !mode) {
    recap.classList.add("hidden");
    return;
  }

  const taux = FRAIS[mode] || 0;
  const frais = Math.round(montant * taux);
  const net = montant - frais;

  recap.innerHTML =
    '<div class="ligne"><span>Montant demandé</span><span>' + montant + ' F</span></div>' +
    '<div class="ligne"><span>Frais (' + (taux * 100).toFixed(2) + ' %)</span><span>' + frais + ' F</span></div>' +
    '<div class="ligne total"><span>Tu recevras</span><span>' + net + ' F</span></div>';
  recap.classList.remove("hidden");
}

async function demanderRetrait() {
  const montant = Number(document.getElementById("montant").value);
  const mode    = document.getElementById("mode").value;
  const numero  = document.getElementById("numero").value.trim();
  const msg     = document.getElementById("retraitMsg");
  msg.innerHTML = "";

  if (!montant || !mode || !numero) {
    return msg.innerHTML = '<div class="msg err">Remplis tous les champs obligatoires</div>';
  }

  try {
    const r = await api("demandeRetrait", { ...session, montant, numero, mode });
    if (r.ok) {
      msg.innerHTML = '<div class="msg ok">✅ Demande envoyée ! Tu recevras un mail.</div>';
      document.getElementById("montant").value = "";
      document.getElementById("numero").value = "";
      document.getElementById("mode").value = "";
      document.getElementById("modeInfo").textContent = "";
      document.getElementById("recap").classList.add("hidden");
      const d = await api("dashboard", session);
      if (d.ok) afficherDashboard(d.ambassadeur);
    } else {
      msg.innerHTML = '<div class="msg err">' + r.error + '</div>';
    }
  } catch (e) {
    msg.innerHTML = '<div class="msg err">Erreur réseau</div>';
  }
}

function deconnexion() {
  localStorage.removeItem("cc_session");
  session = null;
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("code").value = "";
  document.getElementById("pin").value = "";
}

(function init() {
  const saved = localStorage.getItem("cc_session");
  if (saved) {
    session = JSON.parse(saved);
    api("dashboard", session).then(r => {
      if (r.ok) afficherDashboard(r.ambassadeur);
      else deconnexion();
    }).catch(() => deconnexion());
  }
})();
</script>
</body>
</html>
